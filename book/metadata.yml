# Book metadata for the PDF and EPUB builds (Task 22).
# Strings match the 1e print edition (ElementsOfDataScienceBook latex/settings.tex
# and front_matter.tex), except that the print ISBN identifies the paperback
# and is left out.

title: Elements of Data Science
subtitle: Getting Started with Data Science and Python
author: Allen B. Downey
version: "1.1.0"   # 1e revised for the ebook (Allen, 2026-10-27)
publisher: Green Tea Press
publisher_place: Needham, Massachusetts
copyright_year: "2024–2026"
license: >-
  Permission is granted to copy, distribute, transmit and adapt this work
  under the Creative Commons Attribution-NonCommercial-ShareAlike 4.0
  International License: <https://creativecommons.org/licenses/by-nc-sa/4.0>.
commercial: >-
  If you are interested in distributing a commercial version of this work,
  please contact the author.
cover_credit: Cover design by Liana Moisescu.
site_url: https://allendowney.github.io/ElementsOfDataScience
leanpub_url: https://leanpub.com/eldasci   # {{leanpub_url}} in book/front/

# The book, in order. Stems resolve to soln/{stem}.ipynb; a case-study
# chapter is a mapping with the repo, the full commit, and the file, which
# stage.py downloads from GitHub. Chapters in parts are numbered in this
# order, in every edition; chapters in `back` are not. To update a case
# study, move its commit after its CI passes.
# Images from the repos, scaled from their width in the notebook (Allen,
# 2026-10-28)
figure_scale:
  20190907_FNC941.png: 0.8       # The Economist, chapters 3 and 6
  pew_religion_figure1.png: 0.5  # Pew, chapter 6
  resampling.png: 0.8            # chapters 11 and 12
  hypothesis_testing.png: 0.8    # chapter 13

parts:
  - title: From Python to Pandas
    chapters:
      - 01_variables
      - 02_times
      - 03_arrays
      - 04_loops
      - 05_dictionaries
      - 06_plotting
  - title: Exploratory Data Analysis
    chapters:
      - 07_dataframes
      - 08_distributions
      - 09_relationships
      - 10_regression
  - title: Statistical Inference
    chapters:
      - 11_resampling
      - 12_bootstrap
      - 13_hypothesis
  - title: "Case Study: Political Alignment"
    chapters:
      - stem: 14_polviews
        repo: PoliticalAlignmentCaseStudy
        commit: 1910faddd0b13e379a850218657f2f19f0417797
        file: 02_polviews_soln.ipynb
      - stem: 15_outlook
        repo: PoliticalAlignmentCaseStudy
        commit: 1910faddd0b13e379a850218657f2f19f0417797
        file: 03_outlook.ipynb
  - title: "Case Study: Algorithmic Fairness"
    chapters:
      - stem: 16_classification
        repo: RecidivismCaseStudy
        commit: e9dc7f47a55bffcffb25bdff1b4a19055d455730
        file: 01_classification.ipynb
      - stem: 17_calibration
        repo: RecidivismCaseStudy
        commit: e9dc7f47a55bffcffb25bdff1b4a19055d455730
        file: 02_calibration.ipynb
back:
  - 14_outro

# LeanPub editions. The book is everything above, then its `back` page; the
# sample is the preface, the chapters listed, and its `back` page. The badge
# goes on the title page. Files: book/leanpub/downey-elements-of-data-science-{version}[-{edition}].{pdf,epub}
editions:
  book:
    back: front/book_back
  sample:
    badge: [Free sample, Chapters 6 and 7]
    chapters:
      - 06_plotting
      - 07_dataframes
    back: front/sample_back
